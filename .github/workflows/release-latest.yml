name: Publish latest zip

# Rebuild the downloadable zip on every push to main and publish it to a single
# rolling "latest" release. Grab the newest build any time with:
#
#     gh release download latest -R oestech/warbler
#
on:
  push:
    branches: [main]

# Required to create/delete the release and move the "latest" tag.
permissions:
  contents: write

# A newer push supersedes an in-flight run so the rolling release never races.
concurrency:
  group: publish-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip of the tracked tree
        run: git archive --format=zip --prefix=warbler/ -o warbler.zip HEAD

      - name: Refresh the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete the previous release and its tag, then recreate both at this
          # commit, so "latest" always points here and carries a fresh asset.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest warbler.zip \
            --target "$GITHUB_SHA" \
            --title "Latest (main)" \
            --notes "Zip of main @ $GITHUB_SHA"
